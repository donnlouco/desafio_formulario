<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="https://fonts.google.com/specimen/Karla">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Contact form</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    body{background-color: #E0F1E7;
    }
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }

    .main{border-radius: 20px; 
      background-color: white;
      padding: 30px; 
      width: 550px;
      height: 570px;
      font-family: "Karla", sans-serif;}

    .primeiroQuadrante{ display: flex;
    gap: 20px;
    margin-bottom: 20px;
    width: 100%;}

    .primeiroQuadrado{
      flex:1
    }

    .container{align-items: center; 
      width: 100%; 
      height: 100%; 
      justify-items: center;
    }

    .main h2{margin: 0px; 
    margin-bottom: 20px;
    font-size: 30px;
    }
    .labelGeral{
      font-size: 16px;
    }

    .segundoQuadrante{
      margin-bottom: 20px;
    }

    .terceiroQuadrante{
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }

    .checkBox{
      display: flex;
      gap: 20px;
      width: 100%;
    }

    .quadrado{
      padding: 5px 16px;
      width: 87%;
    }

    input{
      height: 32px;
      border: 1px solid hsl(187, 24%, 22%);
      border-radius: 05px;
      margin-top: 7px;
    }

    #campoTexto{
      width: 99%;
      border-radius: 5px;
      margin-top: 10px;
    }

    #campoEmail{
      width: 94%;
      height: 45px;
      padding: 0px 15px;
    }

    #botaoEnviar{
      width: 100%;
      height: 45px;
      background-color: hsl(169, 82%, 27%);
      border: 0px solid;
      border-radius: 5px;
      text-decoration: none;
      color: white;
      font-weight: 600;
      margin-top: 0px;
    }

    #botaoEnviar:hover{
      cursor: pointer;

    }

    .checkboxOption{
      flex: 1;
      display: flex;
      flex-wrap: nowrap;
      gap: 7px;
      margin: 0;
      padding: 2px 15px;
      border: 1px solid  hsl(187, 24%, 22%);
      border-radius: 5px;
      color: black;
      align-items: center;
    }

    .checkboxOption span{
      width: 100%;
    }

    .checkBox{
      gap: 20px;
      margin-top: 10px;
      display: flex;
    }

    #ultimoId{
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 20px;
    }

    #ultimoId input{
      height: 20px;
    }

    .checkboxError{
      color: red;
      display: none;
      margin-top: 6px;
    }
    

  </style>
</head>
<body>
  <div class="container">
     <div class="main">
      <form action="">
      <h2>Contact Us</h2>
      <div class="primeiroQuadrante">
        <div class="primeiroQuadrado">
          <label for="" class="labelGeral">First Name *</label><br>
          <input type="text" class="quadrado" id="inputPrimeiroNome">
          <span class="checkboxError"></span>
        </div>
        <div class="primeiroQuadrado">
          <label for="" class="labelGeral">Last Name *</label><br>
          <input type="text" class="quadrado" id="inputUltimoNome">
          <span class="checkboxError"></span>
        </div>
      </div>
      <div class="segundoQuadrante">
        <label for="" class="labelGeral">Email Address *</label><br>
        <input type="email" name="" id="campoEmail">
        <span class="checkboxError"></span>
      </div>
      <div class="terceiroQuadrante">
        <label for="" class="labelGeral">Query Type *</label>
        <div class="checkBox">
          <label for="general" class="checkboxOption">
            <input type="radio" name="queryType" id="general" value="general">
            <span>General Enquiry</span>
          </label>
          <label for="support" class="checkboxOption">
            <input type="radio" name="queryType" id="support" value="support" >
            <span>Support Request</span>
          </label>
        </div>
        <span class="checkboxError"></span>
      </div>
      <div class="quartoQuadrante">
        <label for="" class="labelGeral">Message *</label><br>
        <textarea rows="6" cols="40" id="campoTexto"></textarea>
        <span class="checkboxError"></span>
      </div>
      
      <label for="" id="ultimoId">
        <input type="checkbox" name="" id="checkInFinal"> 
        <span>I consent to being contacted by the team *</span>
        <span class="checkboxError"></span>
      </label><br>
      <button type="submit" id="botaoEnviar">Submit</button>
    </form>
    </div>
  </div>
 
  
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
